<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#07040f">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Festival Visuals - Synth Pilot 🌌</title>
<style>
:root{color-scheme:dark;--bg:#07040f;--card:#171126;--tx:#f4f0ff;--mu:#a79cc4;--ac:#ff2d95;--ac2:#00e5ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px -apple-system,Helvetica,Arial,sans-serif;padding:10px;max-width:520px;margin-inline:auto}
h1{font-size:20px;margin:4px 0 8px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;color:transparent;text-align:center;}
#cv-container { position: relative; width: 100%; margin: 0 auto; display: block; }
canvas{width:100%;max-height:56vh;aspect-ratio:9/16;object-fit:contain;display:block;background:#000;border-radius:14px}

/* Controles de Grabación Ocultos */
#hidden-timer { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); color: #00e5ff; font-family: monospace; font-size: 20px; font-weight: bold; opacity: 0; pointer-events: none; z-index: 50; text-shadow: 0px 0px 8px rgba(0,229,255,1); }
#ghost-stop { position: absolute; top: 0; right: 0; width: 100px; height: 100px; opacity: 0; z-index: 100; cursor: pointer; display: none; -webkit-tap-highlight-color: transparent; }

.ui-panel { transition: opacity 0.3s ease; }
.ui-hidden { opacity: 0; pointer-events: none; position: absolute; }

.row{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}
button,.btn{flex:1;min-height:46px;border:0;border-radius:12px;background:var(--card);color:var(--tx);font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 10px;text-align:center;cursor:pointer;}
button.on{background:linear-gradient(90deg,var(--ac),#7b2dff)}
button.big{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#000;font-size:17px}
input[type=text],select{flex:1;min-height:44px;border-radius:12px;border:1px solid #3a2f5a;background:var(--card);color:var(--tx);padding:0 12px;font-size:16px}
input[type=range]{width:100%}
label{font-size:13px;color:var(--mu)}
#msg{font-size:14px;color:var(--ac2);min-height:20px; text-align:center;}
#bar{height:6px;background:var(--card);border-radius:3px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2))}
audio{display:none}
#bpm{flex:1.6;text-align:center;font-size:18px;font-weight:700;background:#0b0d14;color:#fff;border:1px solid #2a2f45;border-radius:10px;padding:8px;min-width:0}
#cv-container:fullscreen{background:#000;display:flex;align-items:center;justify-content:center}
#cv-container:fullscreen canvas{height:100vh;max-height:100vh;width:auto;aspect-ratio:9/16}
#cv-container:-webkit-full-screen{background:#000;display:flex;align-items:center;justify-content:center}
#cv-container:-webkit-full-screen canvas{height:100vh;max-height:100vh;width:auto;aspect-ratio:9/16}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
#sc.row{display:grid;grid-template-columns:repeat(2,1fr)}
#sc button{min-height:40px;font-size:13px}

@keyframes lvb{0%,100%{box-shadow:0 0 0 1px rgba(255,255,255,.14),0 0 14px rgba(255,45,149,.45)}50%{box-shadow:0 0 0 1px rgba(255,255,255,.24),0 0 26px rgba(255,45,149,.8)}}
@keyframes lvp{50%{opacity:.3}}@keyframes lvf{0%{box-shadow:0 0 0 3px var(--ac2),0 0 34px var(--ac2)}100%{box-shadow:0 0 0 0 transparent}}
#sc button.on{animation:lvb 3.2s ease-in-out infinite}
#sc button.fv:not(.on){box-shadow:inset 0 0 0 1px rgba(255,200,60,.5)}
select.live{border-color:var(--ac2);box-shadow:0 0 0 1px rgba(0,229,255,.25),0 0 16px rgba(0,229,255,.3);background:linear-gradient(90deg,rgba(0,229,255,.12),var(--card) 65%)}
.fl{animation:lvf 1.2s ease-out}
#lv{position:sticky;top:0;z-index:20;display:flex;gap:6px;overflow-x:auto;padding:6px 2px;margin:0 0 6px;background:rgba(7,4,15,.84);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid #2a2146;scrollbar-width:none}
#lv::-webkit-scrollbar{display:none}
#lv .lc{--c:#ff2d95;flex:none;display:flex;align-items:center;gap:6px;min-height:32px;padding:0 5px 0 10px;border-radius:999px;background:var(--card);border:1px solid var(--c);box-shadow:0 0 12px -3px var(--c);font-size:12.5px;cursor:pointer;white-space:nowrap}
#lv .lc[data-k^=eq]{--c:#00e5ff}#lv .lc[data-k^=mh]{--c:#a56bff}#lv .lc[data-k=fxm]{--c:#ffc83c}#lv .lc[data-k=ovl]{--c:#4dffa6}
#lv .lc .d{width:7px;height:7px;border-radius:50%;background:var(--c);animation:lvp 2.4s ease-in-out infinite}
#lv .lc b{font-weight:700;opacity:.7}
#lv .lc i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);font-size:13px}
#lv .em{font-size:12px;color:var(--mu);padding:8px 4px;white-space:nowrap}
#scq{width:100%;flex:1 1 100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.pk{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:2px 0 8px}.pkh{grid-column:1/-1;font-size:11.5px;color:var(--mu);margin:0 0 2px}
.pk button{min-height:40px;padding:8px 10px;font-size:12.5px;border-radius:12px;border:1px solid #3a2f5a;background:var(--card);color:inherit;text-align:left;cursor:pointer}
.pk button.on{border-color:var(--ac2);background:linear-gradient(90deg,rgba(0,229,255,.2),var(--card) 80%);box-shadow:0 0 0 1px rgba(0,229,255,.25),0 0 16px rgba(0,229,255,.35)}
.pk.mh button.on{border-color:#a56bff;background:linear-gradient(90deg,rgba(165,107,255,.22),var(--card) 80%);box-shadow:0 0 0 1px rgba(165,107,255,.3),0 0 16px rgba(165,107,255,.4)}
.pk button.pz{grid-column:1/-1;text-align:center;opacity:.8}
</style></head><body>

<div id="cv-container">
    <canvas id="cv"></canvas>
    <div id="hidden-timer">00:00.00</div>
    <div id="ghost-stop"></div>
</div>

<div class="ui-panel" id="ui">
    <h1>🌌 Synth Pilot VFX</h1>
<div id="lv" class="ui-panel" aria-live="polite"></div>
    
    <div class="row">
     <label class="btn">🎵 Cargar Pistas<input class="vh" id="f_audio" type="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.aif,.aiff,.caf,.flac" multiple></label>
     <label class="btn">🎞 Audio de un video<input class="vh" id="f_video" type="file" accept="video/*"></label>
    </div>
    <div class="row"><select id="tl"><option>(sin pistas)</option></select></div>
    
    <div class="row">
     <button id="pl">▶ Reproducir</button>
    </div>
    
    <p id="msg">Elige una pista musical o extrae el audio de un video.</p>
    
    <div class="row"><input type="text" id="scq" placeholder="🔍 Buscar escena o túnel…" autocomplete="off"></div>
    <div class="row"><select id="xbl"><option value="scr">Túneles externos: mezclar con tu fondo</option><option value="over">Túneles externos: opacos (tapan el fondo)</option></select></div>
    <div class="row" id="sc"></div>
    <div class="row"><button id="favb">⭐ Elegir escenas para Auto: OFF</button></div>
    <div class="row"><button id="swb" class="on">💥 Ondas de choque: ON</button></div>
    
    <div class="row"><select id="bg"><option value="9">Fondo: ninguno (negro)</option><option value="0">Fondo: Abismo Cyber</option><option value="1">Fondo: Aurora Galáctica</option><option value="2">Fondo: Matrix</option><option value="5">Fondo: Mi galería (fotos y videos)</option></select></div>
    <div class="row"><label class="btn">🖼🎬 Fotos y videos (sin límite)<input class="vh" id="gal" type="file" accept="image/*,video/*" multiple></label></div>
    <div class="row"><button id="gprev">⏮ Anterior</button><button id="gnext">Siguiente ⏭</button></div>
    <div class="row"><button id="imc">🗑 Borrar galería</button><button id="nim" style="background:none;color:var(--mu)">0 archivos</button><span id="bd" title="parpadea con cada golpe detectado" style="opacity:.15;color:#ff2d95;font-size:22px;align-self:center;flex:0 0 28px;text-align:center">●</span></div>
    <label>📷 Fotos: cambian cada <span id="ebl">1</span> golpe(s) de la música</label><input id="eb" type="range" min="1" max="8" value="1">
    <label>🎬 Videos: duran <span id="vdl">hasta terminar</span></label><input id="vd" type="range" min="0" max="30" value="0">
    <div class="row"><select id="gord"><option value="0">Orden: secuencial</option><option value="1">Orden: aleatorio</option></select></div>
    <div style="margin:10px 0 4px;font-weight:700">🥁 Ritmo (BPM)</div>
    <div class="row"><select id="bmode"><option value="1">Golpe: Rejilla BPM (recomendado)</option><option value="0">Golpe: Detector automático</option></select></div>
    <div class="row"><button id="bminus">−</button><input id="bpm" type="number" min="50" max="220" step="0.1" value="120"><button id="bplus">+</button><button id="bhalf">½</button><button id="bdouble">×2</button></div>
    <div class="row"><button id="bdet">🔍 Detectar</button><button id="btap">👆 Tap</button><button id="bhere">📍 Golpe aquí</button></div>
    <div class="row"><button id="bnl">◀ −20 ms</button><button id="bnr">+20 ms ▶</button></div>
    <div class="row"><label style="flex:1;display:flex;gap:8px;align-items:center"><input type="checkbox" id="bclk"> 🔔 Escuchar la rejilla (metrónomo) para comprobar</label></div>
    <label id="binfo">♩ sin analizar</label>
    <div style="margin:12px 0 4px;font-weight:700">🎬 Modo TikTok Pro</div>
    <div class="row"><select id="sty"></select></div>
    <div class="row"><input id="pname" type="text" placeholder="Nombre de tu preset"><button id="psave">💾 Guardar</button><button id="pdel">🗑</button></div>
    <div class="row"><button id="pcopy">📋 Copiar código</button><button id="pshare">📤 Compartir</button></div>
    <div class="row"><textarea id="pcode" rows="3" placeholder="Pega aquí el código de tu amigo (o el mensaje completo)" style="flex:1;min-width:0;background:#0b0d14;color:#fff;border:1px solid #2a2f45;border-radius:10px;padding:8px;font-size:13px;resize:vertical"></textarea><button id="pimpc">📥 Importar</button></div>
    <div class="row"><button id="pexpf">💾 Exportar archivo (todos)</button><button id="pimpf">📂 Importar archivo</button></div>
    <input class="vh" id="pfile" type="file">
    <div class="row"><button id="pimpp">📋 Pegar e importar</button><button id="pcopyall">📋 Copiar TODOS (código)</button></div>
    <label id="pinfo" style="color:var(--mu);font-size:12px"></label>
    <label style="color:var(--mu);font-size:12px;line-height:1.4">ℹ️ No hace falta configurar nada. <b>Para recibir:</b> pega el código (o el mensaje completo) arriba y pulsa Importar, o usa «Importar archivo». <b>Para enviar:</b> «Compartir» o «Copiar código». Tus amigos deben abrir la misma herramienta actualizada.</label>
    <div class="row"><button id="poff">⏻ Apagar todos los efectos (túnel, capas y FX)</button><button id="rfr">🔄 Refrescar pantalla</button></div>
    <div class="row"><select id="fxm"><option value="0">FX en golpe: ninguno</option><option value="1">FX: zoom en golpe</option><option value="2">FX: sacudida</option><option value="3">FX: zoom + sacudida</option><option value="4">FX: destello blanco</option></select></div>
    <div class="row"><select id="ovl"><option value="0">Espectro: ninguno</option><option value="1">Espectro: barras (abajo)</option><option value="2">Espectro: barras espejo (centro)</option><option value="3">Espectro: anillo (centro)</option></select></div>
    <div class="row"><select id="bars"><option value="0">Duración: la que elijas arriba</option><option value="4">Duración: 4 compases exactos</option><option value="8">Duración: 8 compases exactos</option><option value="16">Duración: 16 compases exactos</option><option value="32">Duración: 32 compases exactos</option></select></div>
    <div class="row"><label style="flex:1;display:flex;gap:8px;align-items:center"><input type="checkbox" id="lpf" checked> 🔁 Repetir la pista si termina antes de la duración elegida</label></div>
    <div class="row"><button id="bsnap">🎯 Alinear inicio al golpe</button><button id="bshift">↻ Mover el "1"</button></div>
    <div class="row"><label style="flex:1;display:flex;gap:8px;align-items:center"><input type="checkbox" id="vfade"> Fundido de entrada y salida (video y audio)</label></div>
    <div class="row"><label style="flex:1;display:flex;gap:8px;align-items:center"><input type="checkbox" id="norm" checked> Normalizar volumen (−1 dB)</label></div>
    <div class="row"><label style="flex:1;display:flex;gap:8px;align-items:center"><input type="checkbox" id="safe"> 📱 Ver zona segura de TikTok (solo vista previa)</label></div>
    <div style="margin:16px 0 4px;font-weight:700">🎚️ Ecualizadores de alto impacto</div>
    <div class="row"><select id="eq1"></select></div>
    <div class="row"><select id="eq2"></select></div>
    <label>Intensidad: <span id="eqil">100</span>%</label><input id="eqi" type="range" min="20" max="160" value="100">
    <label>Tamaño: <span id="eqsl">125</span>%</label><input id="eqs" type="range" min="60" max="220" value="125">
    <label>Altura: <span id="eqyl">auto</span> <span style="color:var(--mu)">(0 = automática según el estilo)</span></label><input id="eqy" type="range" min="-100" max="100" value="0">
    <div style="margin:16px 0 4px;font-weight:700">🕸️ Mallas flotantes</div>
    <div class="row"><select id="mh1"></select></div>
    <div class="row"><select id="mh2"></select></div>
    <label>Intensidad: <span id="mhil">100</span>%</label><input id="mhi" type="range" min="20" max="160" value="100">
    <label>Tamaño: <span id="mhsl">130</span>%</label><input id="mhs" type="range" min="60" max="220" value="130">
    <label>Altura: <span id="mhyl">centro</span> <span style="color:var(--mu)">(0 = centro)</span></label><input id="mhy" type="range" min="-100" max="100" value="0">
    <div style="margin:16px 0 4px;font-weight:700">🎨 Color y dinámica de las capas</div>
    <div class="row"><select id="pal"><option value="0">Color inteligente (contrasta con tu fondo)</option><option value="1">Arcoíris suave</option><option value="2">Blanco hielo</option><option value="3">Fuego</option><option value="4">Océano</option><option value="6">Naranja → Rosa (como tu ejemplo)</option><option value="5">Color personalizado →</option></select><input id="pcol" type="color" value="#00e5ff" style="flex:0 0 52px;height:42px;padding:2px"></div>
    <label>Auto: cambia de estilo cada <span id="laul">8</span> compases</label><input id="lau" type="range" min="2" max="32" value="8">
    <div class="row"><label style="flex:1;display:flex;gap:8px;align-items:center"><input type="checkbox" id="dyn" checked> ⚡ Dinámica inteligente (crecen y brillan en los drops)</label></div>
    
    <details style="margin:6px 0"><summary style="font-size:15px;padding:8px 0">⚙ Ajustes Cinematográficos</summary>
    <div class="row"><select id="spd"><option value="0">½ golpe</option><option value="1">1 golpe</option><option value="2" selected>2 golpes</option><option value="3">4 golpes</option></select></div>
    <label>Brillo Overlay</label><input id="pb" type="range" min="0" max="100" value="72">
    <label>Apertura del túnel (centro libre): <span id="hol">50</span>%</label><input id="ho" type="range" min="15" max="95" value="50">
    <label>Retraso visual: <span id="dll">60</span> ms</label><input id="dl" type="range" min="0" max="200" value="60">
    <label>Sensibilidad de golpe: <span id="sel">50</span>% <span style="color:var(--mu)">(sube si no detecta, baja si detecta de más)</span></label><input id="sens" type="range" min="0" max="100" value="50">
    <label>Auto: cambia de escena cada <span id="aul">12</span> s (en el siguiente golpe)</label><input id="aus" type="range" min="4" max="40" value="12">
    <div class="row"><select id="tmode"><option value="0">Título: apagado</option><option value="1">Título: primeros 5 s</option><option value="2">Título: siempre (abajo)</option><option value="3">Título: siempre (arriba)</option></select></div>
    <div class="row"><input id="txt" type="text" placeholder="Texto / nombre de la pista"></div>
    <div class="row"><input id="txt2" type="text" placeholder="Subtítulo (artista, @usuario)"><input id="tcol" type="color" value="#ffffff" style="flex:0 0 52px;height:42px;padding:2px"></div>
    <label>Tamaño del texto: <span id="tszl">64</span></label><input id="tsz" type="range" min="30" max="140" value="64">
    <div class="row"><select id="tsty"><option value="0">Texto: sombra suave</option><option value="1">Texto: contorno negro</option><option value="2">Texto: caja translúcida</option></select></div>
    <div class="row"><button id="rst">↺ Restablecer ajustes</button><button id="fs" style="display:none">⛶ Pantalla completa</button></div>
    <label>Mover Centro (X)</label><input id="cx" type="range" min="-250" max="250" value="0">
    <label>Mover Centro (Y)</label><input id="cy" type="range" min="-300" max="300" value="0">
    </details>
    
    <label>Inicio del clip: <span id="stl">0.0</span> s <span id="stm"></span> — toca o arrastra la onda</label>
    <canvas id="wf" style="width:100%;height:64px;border-radius:10px;background:#0b0d14;touch-action:none"></canvas>
    <input id="st" type="range" min="0" max="0" step="0.001" value="0">
    <div class="row"><button id="sm1">−1 s</button><button id="snow">📍 Inicio aquí</button><button id="sp1">+1 s</button></div>
    
    <div class="row"><select id="fpsel"><option value="60">60 FPS</option><option value="30">30 FPS (más fluido en equipos lentos)</option></select></div>
    <div class="row"><select id="len"><option value="15">Duración 15 s</option><option value="30" selected>Duración 30 s</option><option value="60">Duración 60 s</option><option value="90">Duración 90 s</option><option value="0">Hasta el final de la pista (máx. 180 s)</option></select></div>
    <div class="row"><button class="big" id="ex">⏺ Grabar MP4 (1080x1920 @60FPS)</button></div>
    <div id="bar"><i id="pr"></i></div>
    <div class="row"><button class="big" id="sv" style="display:none">💾 Guardar en Fotos</button></div>
</div>

<video id="pv" controls playsinline style="width:100%; border-radius:12px; margin-top:8px; display:none;"></video>

 const b=Uint8Array.from(atob(XTZ[k]),c=>c.charCodeAt(0)),html=await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text();

  if(GRIDOK){const T0=TT>-1e8?TT:t,fa=(T0-BOFF)*b/60,ft=o.ms/1000*br/60;let e=(fa-ft)%1;e-=Math.round(e);o.ms+=e*(60/br)*1000*.02}   // enganche de fase al compás de tu app
